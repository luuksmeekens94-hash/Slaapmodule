name: Slaaproute V2 checks
on:
  pull_request:
  push:
    branches: [codex/slaaproute-v2]
permissions:
  contents: read
jobs:
  patient-route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slaaproute-v2-browser-evidence
          path: |
            playwright-report/
            test-results/
            reviews/slaapmodule-v2/evidence/
          retention-days: 14
